# Mahalak — Capacitor iOS (App Store)
# Capacitor 8 uses Swift Package Manager (App.xcodeproj), not CocoaPods workspace.
#
# Before first build in Codemagic UI:
# 1. Team settings → Integrations → App Store Connect → add API key named "Mahalak"
# 2. Create apps in App Store Connect with matching bundle IDs
# 3. Set APP_STORE_APP_ID (numeric) from App Store Connect → App Information

workflows:
  customer-ios-app-store:
    name: Customer iOS → App Store
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Mahalak
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: iq.mahalak.app
      vars:
        APP_DIR: apps/customer
        BUNDLE_ID: iq.mahalak.app
        XCODE_PROJECT: App.xcodeproj
        XCODE_SCHEME: App
        APP_STORE_APP_ID: 0000000000
        MARKETING_VERSION: "1.0.5"
      node: 22
      xcode: latest
      npm: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci --prefer-offline --no-audit --no-fund

      - name: Build web assets (customer)
        script: |
          npm run build:customer

      - name: Capacitor sync iOS
        script: |
          cd "$APP_DIR"
          npx cap sync ios

      - name: Set up code signing (profiles → Xcode project)
        script: |
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$APP_DIR/ios/App/$XCODE_PROJECT"

      - name: Set version & build number
        script: |
          cd "$CM_BUILD_DIR/$APP_DIR/ios/App"
          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          cd "$CM_BUILD_DIR/$APP_DIR/ios/App"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release
    artifacts:
      - apps/customer/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - kararsafaa1221@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  merchant-ios-app-store:
    name: Merchant iOS → App Store
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Mahalak
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: iq.mahalak.merchant
      vars:
        APP_DIR: apps/merchant
        BUNDLE_ID: iq.mahalak.merchant
        XCODE_PROJECT: App.xcodeproj
        XCODE_SCHEME: App
        APP_STORE_APP_ID: 0000000000
        MARKETING_VERSION: "1.0.6"
      node: 22
      xcode: latest
      npm: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci --prefer-offline --no-audit --no-fund

      - name: Build web assets (merchant)
        script: |
          npm run build:merchant

      - name: Capacitor sync iOS
        script: |
          cd "$APP_DIR"
          if [ ! -d "ios/App" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Set up code signing (profiles → Xcode project)
        script: |
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$APP_DIR/ios/App/$XCODE_PROJECT"

      - name: Set version & build number
        script: |
          cd "$CM_BUILD_DIR/$APP_DIR/ios/App"
          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          cd "$CM_BUILD_DIR/$APP_DIR/ios/App"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release
    artifacts:
      - apps/merchant/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - kararsafaa1221@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
