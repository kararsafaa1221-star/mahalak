# Mahalak — Capacitor iOS (App Store)
# Not React Native: Vite + Capacitor monorepo.
#
# Before first build in Codemagic UI:
# 1. Team settings → Integrations → App Store Connect → add API key
#    (name must match `integrations.app_store_connect` below)
# 2. Create apps in App Store Connect with matching bundle IDs
# 3. Set APP_STORE_APP_ID (numeric) from App Store Connect → App Information
# 4. Commit & push this file, then click "Check for configuration files"

workflows:
  customer-ios-app-store:
    name: Customer iOS → App Store
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      # Must match the API key name in Codemagic → Team → Integrations
      app_store_connect: Mahalak
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: iq.mahalak.app
      vars:
        APP_DIR: apps/customer
        BUNDLE_ID: iq.mahalak.app
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
        # Replace with App Store Connect numeric App ID
        APP_STORE_APP_ID: 0000000000
        MARKETING_VERSION: "1.0.5"
      node: 22
      xcode: latest
      cocoapods: default
      npm: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci --prefer-offline --no-audit --no-fund

      - name: Build web assets (customer)
        script: |
          npm run build:customer

      - name: Ensure iOS platform + Capacitor sync
        script: |
          cd "$APP_DIR"
          if [ ! -d "ios/App" ]; then
            echo "iOS project missing — adding Capacitor iOS platform"
            npx cap add ios
          fi
          npx cap sync ios

      - name: CocoaPods install
        script: |
          cd "$APP_DIR/ios/App"
          pod install --repo-update

      - name: Set up code signing (profiles → Xcode project)
        script: |
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$APP_DIR/ios/App/App.xcodeproj"

      - name: Set version & build number
        script: |
          cd "$CM_BUILD_DIR/$APP_DIR/ios/App"
          # BUILD_NUMBER is provided by Codemagic
          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          cd "$CM_BUILD_DIR/$APP_DIR/ios/App"
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release
    artifacts:
      - apps/customer/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - kararsafaa1221@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # Upload build to TestFlight / App Store Connect (does not auto-submit for review)
        submit_to_testflight: true
        submit_to_app_store: false

  merchant-ios-app-store:
